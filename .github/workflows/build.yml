name: build

# The point of this workflow is patch rot. MR !357 is unmerged, so libfprint
# master moves underneath it. When that happens the patch stops applying and
# this fails loudly, rather than a user discovering it from a broken build.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Weekly, Monday 06:17 UTC. Catches upstream breakage even when nobody
    # touches this repo - the common case for a patch against a moving target.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: apply patch and build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          # gudev is deliberately omitted: libfprint treats it as optional
          # (dependency('gudev-1.0', required: false)) and the driver does
          # not need it. Note the real package name is libgudev-1.0-dev -
          # libgudev-1-dev does not exist and fails the whole apt run.
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            git \
            ninja-build \
            pkg-config \
            python3-pip \
            libglib2.0-dev \
            libglib2.0-dev-bin \
            libgusb-dev \
            libusb-1.0-0-dev \
            libpixman-1-dev \
            libcairo2-dev \
            libjson-glib-dev \
            libudev-dev \
            libssl-dev

      - name: Install a current meson
        run: |
          # Ubuntu 22.04 ships meson 0.61.2, but libfprint requires >= 0.62.0.
          # 24.04 is new enough, but pip keeps both runners on one version and
          # avoids the distro version drifting under us.
          python3 -m pip install --user --upgrade "meson>=1.2"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          meson --version

      - name: Clone libfprint
        run: |
          git clone --depth 1 https://gitlab.freedesktop.org/libfprint/libfprint.git
          echo "LIBFPRINT_COMMIT=$(git -C libfprint rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Check the patch applies
        run: |
          cd libfprint
          git apply --check ../patches/0001-add-egis0575-driver.patch
          git apply ../patches/0001-add-egis0575-driver.patch
          echo "patch applied cleanly"

      - name: Configure
        run: |
          cd libfprint
          # Build only this driver, not -D drivers=all. "all" pulls in the
          # SPI drivers, which hard-require gudev (meson.build errors with
          # "udev is required for SPI support" when it is absent). Naming the
          # driver explicitly keeps the build honest and dependency-light.
          meson setup build \
            --prefix="${{ runner.temp }}/fp-prefix" \
            --buildtype=release \
            -D doc=false \
            -D introspection=false \
            -D drivers=egis0575 \
            -D udev_rules=disabled \
            -D udev_hwdb=disabled

      - name: Build
        run: ninja -C libfprint/build

      - name: Verify the driver is actually in the binary
        run: |
          # Locate the library rather than assuming a libdir: Ubuntu uses a
          # multiarch path, other distros do not.
          LIB=$(find libfprint/build -name 'libfprint-2.so.2.*' -type f -print -quit)
          test -n "$LIB" || { echo "::error::libfprint shared object not found"; exit 1; }
          echo "library: $LIB"

          # The driver object must have been compiled. Meson names driver
          # objects "drivers_<name>.c.o" inside libfprint-drivers.a.p.
          find libfprint/build -name '*egis0575*.o' -print -quit | grep -q . \
            || { echo "::error::egis0575 was never compiled"; exit 1; }

          # The GType must be registered, or the driver is dead weight. It is
          # a *local* symbol, so check the full symbol table (nm), not the
          # dynamic one, and not the string table: a release build may not
          # leave the name in .rodata.
          # Test via a variable, not `nm | grep -q`: under pipefail, grep -q
          # exits on first match and SIGPIPEs nm, failing the whole pipeline.
          SYMS=$(nm "$LIB")
          case "$SYMS" in
            *fpi_device_egis0575_get_type*) ;;
            *) echo "::error::egis0575 GType missing from library"; exit 1 ;;
          esac
          echo "driver GType registered"

          # The threshold override from this repo must be present.
          case "$(strings "$LIB")" in
            *EGIS0575_FINGER_THRESHOLD*) ;;
            *) echo "::error::threshold override missing from library"; exit 1 ;;
          esac

          echo "driver verified present in $LIB"

      - name: Verify 1c7a:0575 is advertised as supported
        run: |
          # This is the user-visible promise: the device shows up in the
          # supported list. Guards against a driver that builds but is not
          # actually registered in the driver tables.
          SD=$(find libfprint/build -name 'fprint-list-supported-devices' -print -quit)
          test -n "$SD" || { echo "::error::supported-devices tool not built"; exit 1; }
          case "$("$SD")" in
            *1c7a:0575*) ;;
            *) echo "::error::1c7a:0575 not in supported devices"; exit 1 ;;
          esac
          echo "1c7a:0575 listed as supported"

      - name: Build the test tools against the patched library
        run: |
          PFX="${{ runner.temp }}/fp-prefix"
          ninja -C libfprint/build install

          # Debian/Ubuntu use a multiarch libdir, so libfprint installs into
          # lib/x86_64-linux-gnu rather than plain lib. Derive both paths from
          # the installed .pc file rather than assuming a layout.
          PCDIR=$(dirname "$(find "$PFX" -name 'libfprint-2.pc' -print -quit)")
          test -d "$PCDIR" || { echo "::error::libfprint-2.pc not found under $PFX"; exit 1; }

          # libdir is the parent of the pkgconfig dir.
          LIBDIR=$(dirname "$PCDIR")
          # Prepend, do not replace: the system libgusb and glib .pc files
          # live in the default search path and are still needed.
          export PKG_CONFIG_PATH="$PCDIR${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          export LD_LIBRARY_PATH="$LIBDIR${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          echo "libdir: $LIBDIR"
          pkg-config --modversion libfprint-2 gusb

          # Include dirs: libfprint installs its headers under
          # include/libfprint-2 (umbrella header is fprint.h, not
          # libfprint-2.h). gusb.h comes from whichever prefix provides gusb,
          # so ask pkg-config where that is instead of assuming.
          GUSBC=$(pkg-config --cflags gusb)
          CFLAGS="-I$PFX/include -I$PFX/include/libfprint-2 $GUSBC \
                  $(pkg-config --cflags gio-unix-2.0 gobject-2.0 glib-2.0 json-glib-1.0)"
          LIBS="$(pkg-config --libs libfprint-2 gusb gio-unix-2.0)"

          mkdir -p build-tools
          for src in fptest2.c probe2.c probe3.c monitor.c enroll-test.c; do
            out="build-tools/${src%.c}"
            gcc -O1 -Wall -o "$out" "tools/$src" $CFLAGS $LIBS
            echo "built $out"
          done

          # The tools link against the local libfprint, so prove they resolve
          # it rather than any system copy.
          ldd build-tools/fptest2 | grep libfprint || {
            echo "::error::fptest2 did not link against the patched library"; exit 1; }

      - name: Confirm no enroll/verify implementation (documented limitation)
        run: |
          # The driver implements capture only. This is a known, documented
          # limitation, not a regression - but if upstream ever adds these
          # vfuncs, this step should start failing so the README gets updated.
          SRC=libfprint/libfprint/drivers/egis0575.c
          if grep -qE 'img_class->(enroll|verify|identify)' "$SRC"; then
            echo "::warning::driver now implements enroll/verify - update the README status table"
          else
            echo "confirmed: capture-only, as documented"
          fi

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.os }}
          path: |
            libfprint/build/meson-logs/
          retention-days: 7
